<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  </head>
  <body class="admin-body admin-login">
    <form class="admin-login__card admin-form" method="post">
      {{ form.hidden_tag() }}
      <h1>Вход</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
      {% endwith %}
      <label>Логин {{ form.username() }}</label>
      <label>Пароль {{ form.password() }}</label>
      <button class="admin-btn" type="submit">Войти</button>
    </form>
  </body>
</html>
