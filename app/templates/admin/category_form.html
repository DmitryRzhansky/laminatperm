{% extends "admin/layout.html" %}
{% block title %}Категория{% endblock %}
{% block heading %}Изменить категорию{% endblock %}
{% block content %}
<form class="admin-form admin-form--wide" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Название <input name="name" required value="{{ item.name }}"></label>
  <label>Короткий текст <textarea name="intro">{{ item.intro }}</textarea></label>
  <label>Обложка <input type="file" name="cover" accept="image/*">{% if item.cover %}<span class="admin-hint">сейчас: {{ item.cover }}</span>{% endif %}</label>
  <div class="admin-actions">
    <button class="admin-btn" type="submit" data-icon="check">Сохранить</button>
    <a class="admin-btn admin-btn--ghost" href="{{ url_for('admin.categories_list') }}" data-icon="arrow-left">К каталогу</a>
  </div>
</form>
{% endblock %}
