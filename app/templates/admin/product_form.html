{% extends "admin/layout.html" %}
{% block heading %}Товар{% endblock %}
{% block content %}
<form class="admin-form" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Название <input name="name" required value="{{ item.name or '' }}"></label>
  <label>Категория
    <select name="category_id">
      {% for category in categories %}
        <option value="{{ category.id }}" {% if item.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Бренд <input name="brand" value="{{ item.brand or '' }}"></label>
  <label>Цена <input name="price" type="number" step="0.01" value="{{ item.price or '' }}"></label>
  <label>Единица
    <select name="unit">
      <option value="m2" {% if item.unit == 'm2' %}selected{% endif %}>м²</option>
      <option value="pcs" {% if item.unit == 'pcs' %}selected{% endif %}>шт</option>
    </select>
  </label>
  <label>Описание <textarea name="description_html">{{ item.description_html or '' }}</textarea></label>
  <p>Характеристики</p>
  {% for attr in item.attributes %}
    <p><input name="attr_name" value="{{ attr.name }}"> <input name="attr_value" value="{{ attr.value }}"></p>
  {% endfor %}
  <p><input name="attr_name" placeholder="Название"> <input name="attr_value" placeholder="Значение"></p>
  <p><input name="attr_name" placeholder="Название"> <input name="attr_value" placeholder="Значение"></p>
  <label>Фото <input type="file" name="images" accept="image/*" multiple></label>
  <label><input type="checkbox" name="is_published" {% if item.is_published or not item.id %}checked{% endif %}> Показать в каталоге</label>
  <button class="admin-btn" type="submit">Сохранить</button>
</form>
{% endblock %}
