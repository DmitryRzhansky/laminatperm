{% extends "admin/layout.html" %}
{% block heading %}Сотрудник{% endblock %}
{% block content %}
<form class="admin-form" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Имя <input name="name" required value="{{ item.name or '' }}"></label>
  <label>Должность <input name="role" value="{{ item.role or '' }}"></label>
  <label>Коротко о человеке <textarea name="text">{{ item.text or '' }}</textarea></label>
  <label>Фото <input type="file" name="photo" accept="image/*"></label>
  <label><input type="checkbox" name="is_published" {% if item.is_published or not item.id %}checked{% endif %}> Показать на сайте</label>
  <button class="admin-btn" type="submit">Сохранить</button>
</form>
{% endblock %}
