<ul class="catalog__grid catalog__grid--bento" role="list">
  {% for category in categories %}
    <li class="catalog__item">
      <a class="catalog__card" href="{{ url_for('catalog.category', category_slug=category.slug) }}">
        <span class="catalog__media">
          <img
            class="catalog__image"
            src="{{ category.cover|media }}"
            alt=""
            width="1448"
            height="1086"
            loading="lazy"
            decoding="async"
          >
        </span>
        <span class="catalog__body">
          <span class="catalog__card-title">{{ category.name }}</span>
        </span>
      </a>
    </li>
  {% endfor %}
</ul>
